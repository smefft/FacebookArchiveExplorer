stages:
  - build

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_COMMIT_TAG

cache:
  key: ${CI_JOB_NAME}-${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/
    - src-tauri/target/

.build_template: &build_artifacts
  artifacts:
    expire_in: 30 minutes
    paths:
      - src-tauri/target/release/bundle/

build-linux:
  stage: build
  image: rust:latest
  <<: *build_artifacts
  before_script:
    - apt-get update
    - apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xz-utils
    - curl -fsSL https://nodejs.org/dist/v23.11.0/node-v23.11.0-linux-x64.tar.xz | tar -xJ -C /usr/local --strip-components=1
    - node --version
    - npm --version
    - npm ci
  script:
    - npm run tauri build

build-windows:
  stage: build
  tags:
    - saas-windows-medium-amd64
  <<: *build_artifacts
  before_script:
    - choco install -y nodejs-lts rustup.install
    - refreshenv
    - npm ci
  script:
    - npm run tauri build

build-macos:
  stage: build
  tags:
    - macos
  <<: *build_artifacts
  before_script:
    - export PATH="/opt/homebrew/bin:$HOME/.cargo/bin:$PATH"
    - npm ci
  script:
    - npm run tauri build
    - |
      DMG=$(ls src-tauri/target/release/bundle/dmg/*.dmg)
      hdiutil convert "$DMG" -format UDRW -o /tmp/rw.dmg
      MOUNT=$(hdiutil attach /tmp/rw.dmg -nobrowse -readwrite | grep -o '/Volumes/.*')
      cp README.txt LICENSE.txt "$MOUNT/"
      hdiutil detach "$MOUNT"
      rm "$DMG"
      hdiutil convert /tmp/rw.dmg -format UDZO -o "$DMG"
      rm /tmp/rw.dmg
