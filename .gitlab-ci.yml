stages:
  - build

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_COMMIT_TAG

cache:
  key: ${CI_JOB_NAME}-${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/
    - src-tauri/target/

.build_template: &build_artifacts
  artifacts:
    expire_in: 30 minutes
    paths:
      - src-tauri/target/release/bundle/

build-linux:
  stage: build
  image: rust:latest
  <<: *build_artifacts
  before_script:
    - apt-get update
    - apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
    - curl -fsSL https://deb.nodesource.com/setup_23.x | bash -
    - apt-get install -y nodejs
    - npm ci
  script:
    - npm run tauri build

build-windows:
  stage: build
  tags:
    - saas-windows-medium-amd64
  <<: *build_artifacts
  before_script:
    - choco install -y nodejs-lts rustup.install
    - refreshenv
    - npm ci
  script:
    - npm run tauri build

build-macos:
  stage: build
  tags:
    - macos
  <<: *build_artifacts
  before_script:
    - export PATH="/opt/homebrew/bin:$HOME/.cargo/bin:$PATH"
    - npm ci
  script:
    - npm run tauri build